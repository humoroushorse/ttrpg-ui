<div class="p-4 max-w-3xl mx-auto">
  <div class="mb-6">
    <h1>Edit Project</h1>
  </div>

  @if (loading()) {
    <div class="flex flex-col items-center justify-center gap-4 py-16">
      <mat-spinner></mat-spinner>
      <p>Loading project...</p>
    </div>
  } @else {
    <mat-card class="form-card">
      <mat-card-content>
        <form [formGroup]="projectForm" (ngSubmit)="onSubmit()" class="flex flex-col gap-4">
          <mat-form-field class="w-full">
            <mat-label>Project Name</mat-label>
            <input matInput formControlName="name" placeholder="D&D Campaign" maxlength="255" />
            @if (projectForm.get('name')?.hasError('required') && projectForm.get('name')?.touched) {
              <mat-error>Project name is required</mat-error>
            }
          </mat-form-field>

          <mat-form-field class="w-full">
            <mat-label>Description</mat-label>
            <textarea matInput formControlName="description" placeholder="Project description..." rows="4"></textarea>
          </mat-form-field>

          <div class="flex justify-end gap-4 mt-4">
            <button mat-button type="button" (click)="onCancel()">Cancel</button>
            <button mat-raised-button color="primary" type="submit" [disabled]="projectForm.invalid">
              <mat-icon>save</mat-icon>
              Save Changes
            </button>
          </div>
        </form>
      </mat-card-content>
    </mat-card>
  }
</div>
