<form class="link-form" [formGroup]="form" (ngSubmit)="onSubmit()">
  <mat-form-field class="link-form__field" appearance="outline">
    <mat-label>Link Type</mat-label>
    <mat-select formControlName="link_type" aria-label="Link type">
      @for (type of linkTypes; track type) {
        <mat-option [value]="type">{{ linkTypeLabels[type] }}</mat-option>
      }
    </mat-select>
  </mat-form-field>

  <mat-form-field class="link-form__field" appearance="outline">
    <mat-label>Target Work Item ID</mat-label>
    <input
      matInput
      formControlName="target_work_item_id"
      placeholder="Enter work item ID"
      aria-label="Target work item ID"
    />
    @if (form.get('target_work_item_id')?.hasError('required') && form.get('target_work_item_id')?.touched) {
      <mat-error>Work item ID is required</mat-error>
    }
  </mat-form-field>

  <div class="link-form__actions">
    <button mat-button type="button" (click)="onCancel()" [disabled]="loading()">Cancel</button>
    <button mat-raised-button color="primary" type="submit" [disabled]="loading()">Add Link</button>
  </div>
</form>
