<div class="flex flex-row items-center">
  <h1>D&D Spells</h1>
  <div class="grow"><!-- spacer --></div>
  <div>
    <button
      mat-icon-button
      matTooltip="Card View (list)"
      [ngClass]="{ 'primary-color': currentView() === 'card:list' }"
      (click)="currentView.set('card:list')"
      aria-label="Card list view"
    >
      <mat-icon>view_module</mat-icon>
    </button>
  </div>
  <div>
    <button
      mat-icon-button
      matTooltip="Card View (gallery)"
      [ngClass]="{ 'primary-color': currentView() === 'card:gallery' }"
      (click)="currentView.set('card:gallery')"
      aria-label="Card gallery view"
    >
      <mat-icon>view_module</mat-icon>
    </button>
  </div>
  <div>
    <button
      mat-icon-button
      matTooltip="Table View"
      [ngClass]="{ 'primary-color': currentView() === 'table' }"
      (click)="currentView.set('table')"
      aria-label="Table view"
    >
      <mat-icon>view_list</mat-icon>
    </button>
  </div>
</div>

<section class="flex min-h-0 flex-1 flex-col gap-4">
  @if (currentView() === 'table') {
    <mat-card class="min-h-0 flex-1">
      <lib-shared-angular-material-table
        class="min-h-0 flex-1"
        [fillHeight]="true"
        [tableHeader]="'Spells'"
        [columnDefs]="columnDefs"
        [data]="spellStore.entities() || []"
        [loading]="spellStore.loading()"
        [serverSidePagination]="true"
        [filterModel]="spellStore.filters()"
        (filterModelChange)="spellStore.setFilters($event)"
        [sortModel]="spellStore.sort()"
        (sortModelChange)="spellStore.setSort($event)"
        (columnDefsChange)="onColumnDefsChange($event)"
        (resetColumnDefsClicked)="onResetColumnDefsClicked()"
        (rowDoubleClicked)="onViewSpellClicked($event)"
      ></lib-shared-angular-material-table>
      <lib-shared-paginator [store]="spellStore" />
    </mat-card>
  } @else if (currentView() === 'card:list') {
    <div>TODO: Card List In Progress</div>
  } @else {
    <div>TODO: Card Gallery In Progress</div>
  }
</section>
