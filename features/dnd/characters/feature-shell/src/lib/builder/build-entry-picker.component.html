<div class="flex flex-col gap-2">
  <div class="flex flex-row flex-wrap items-center gap-3">
    @if (search(); as searchFn) {
      <mat-form-field subscriptSizing="dynamic" class="grow">
        <mat-label>{{ label() }}</mat-label>
        <lib-shared-forms-single-select-autocomplete
          [ngModel]="selected() ?? current()"
          (ngModelChange)="onSelected($event)"
          [searchFn]="searchFn"
          [viewValueAccessorFn]="optionLabel"
          [isOptionDisabledFn]="blocked"
          [optionTemplate]="entryOption"
          [debounceTime]="250"
          [placeholder]="'Search by name'"
          [dataTestId]="'entry-' + kind()"
        />
      </mat-form-field>
    }
    @if (selected(); as o) {
      <button mat-flat-button type="button" [disabled]="build.saving()" (click)="onSave(o)">Save</button>
      <button mat-button type="button" (click)="onCancel()">Cancel</button>
    }
  </div>
  <mat-slide-toggle [checked]="showAll()" (change)="showAll.set($event.checked)">
    <span class="g-text-body-sm">Show what the rules don't allow</span>
  </mat-slide-toggle>
</div>

<ng-template #entryOption let-o>
  {{ optionLabel(o) }}
  @if (!o.allowed) {
    <span class="g-text-caption"> — {{ o.reasons?.join('; ') }}</span>
  }
</ng-template>
